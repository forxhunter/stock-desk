# 常开的另一台机器（ssh 密钥登录）。填了 host 后，自选 / 设置 / 计划有改动会自动同步过去；
# 部署见 scripts/deploy_remote.py。密钥不在同步范围内，用 scripts/push_secrets.py 自己推。
remote:
  host: ""                      # 例如 user@server
  dir: stock-desk               # 对方主目录下的文件夹
  auto_sync: true

# 大盘预案（分析中心 → 预案）：每一档回撤的点位、历史上到过这一档之后的情况、按持仓 β 测算的影响。
# “到了这一档做什么”写在 data/playbook.yaml 里，由你自己写；程序只在条件到达时把你写的话原样提醒你。
playbook:
  enabled: true

# 议员交易：两院议员按《股票法案》公开申报的股票买卖（规则见 src/stockdesk/congress.py 顶部）。目前读取众议院书记官网站的官方申报。
congress:
  enabled: true
  scan_minutes: 60              # 每隔多少分钟看一次有没有新申报
  years_back: 2                 # 读取最近几年的申报，用来给议员评级（第一次要逐份下载，约一两个小时读完）
  docs_per_scan: 25             # 每轮最多下载几份申报
  horizon_days: 63              # 评估周期：交易日之后多少个交易日，相对标普看方向对不对
  short_days: 21
  min_calls: 10                 # “★ 准”至少要有多少笔可评估的交易（且 95% 区间整体高于 50%）
  watch_calls: 5                # “偏准”至少多少笔（且六成以上方向正确）
  window_days: 730              # 评级的滚动窗口：只算最近这么多天里的交易，旧的自动滚出，所以评级会随时间变
  recent_days: 180              # “近期表现”看最近多少天的交易（按 short_days 评估）；近期转差的下调一级，明显转好的上调
  recent_min: 5                 # 近期至少多少笔才据此调整评级
  alert_scope: accurate         # accurate = 只有评级偏准以上的议员有新申报才提醒；accurate_or_watchlist = 任何议员买卖你的自选也提醒
  alert_days: 7                 # 只提醒最近几天披露的申报
  consensus_days: 90            # 统计“其他议员在同一只股票上”的时间窗
  email_min_severity: warn      # warn = 评级偏准以上的议员有新申报；high = 他买卖的还是你自选里的股票
  max_emails_per_day: 6
  senate:                       # 参议院的申报在 efdsearch.senate.gov，查询前必须先同意该站点首页的使用协议
    enabled: false
    agree_terms: false          # 请先自己打开 https://efdsearch.senate.gov/search/home/ 读完协议（5 U.S.C. app. 105(c)：不得用于非法目的、
                                # 商业目的（新闻媒体除外）、评定信用或募款），同意后把上面两项都改成 true；程序才会替你勾选并查询

# 异动扫描：Polymarket 大额下注、期权放量、期货大幅波动（只读公开数据；规则见 src/stockdesk/flow.py 顶部）
flow:
  enabled: true
  scan_minutes: 10              # 每隔多少分钟扫一次
  alert_tiers: [watch, macro]   # 哪些类别会弹提醒 / 发邮件：watch 自选相关，macro 宏观财经，other 其它
  max_alerts: 5                 # 每轮最多提醒几条
  email_min_severity: high      # 发邮件的最低级别（high / warn）；屏幕提醒不受这条限制
  max_emails_per_day: 6         # 异动邮件每天最多几条
  polymarket:
    enabled: true
    min_usd: 10000              # 只看单笔不小于这个金额的成交
    big_usd: 50000              # 单笔达到这个金额算“大额单”
    recent_minutes: 60          # 看最近多少分钟
    window_hours: 24            # 统计同一钱包累计下注的时间窗
    share_pct: 25               # 近期大单合计占该市场 24 小时成交的比例门槛（%）
    wallet_usd: 100000          # 同一钱包单边净下注门槛
    flow_usd: 60000             # “单边资金”的合计金额门槛
    jump_pts: 5                 # 一小时内概率变化门槛（百分点）
    extreme_price: 0.95         # 成交价高于它的买单视为“吃到期收益”，不计入判断
    exclude_tags: [Sports, Esports]
    exclude_titles: ["Up or Down"]
    show_other: true            # 也列出和自选、宏观都无关的市场
  options:
    enabled: true
    interval_minutes: 30
    expiries: 4                 # 每只股票看最近几个到期日
    min_volume: 500
    vol_oi: 3.0                 # 当日成交量 / 未平仓量 门槛
    min_premium: 200000         # 权利金金额门槛（美元）
    min_dte: 2                  # 跳过几天内到期的合约（当日到期的期权成交量永远远大于未平仓量）
    min_oi: 100                 # 未平仓量太小的行权价不看
    per_symbol: 2               # 每只股票最多列几个合约
    extra_symbols: [SPY, QQQ]   # 自选之外也扫描的标的
  futures:
    enabled: true
    z: 2.0                      # 单日涨跌相当于近 60 日波动的几倍标准差
    volume_mult: 1.8
