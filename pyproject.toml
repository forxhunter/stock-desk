[project]
name = "stock-desk"
version = "0.1.0"
description = "Read-only desktop stock widget: portfolio, explainable quant signals, Polymarket whale-bet and unusual-options scanner, e-mail alerts"
keywords = ["stocks", "portfolio", "desktop-widget", "quant", "backtesting", "polymarket", "options", "ibkr", "robinhood", "alerts"]
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "pyqtgraph>=0.13.7",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "yfinance>=0.2.60",
  "ib_async>=2.0",
  "keyring>=25",
  "pyyaml>=6",
  "tzdata",
]

[project.optional-dependencies]
robinhood-unofficial = ["robin_stocks>=3.4"]
dev = ["pytest>=8", "ta>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
